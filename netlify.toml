# Netlify deployment config.
# Cloudflare Pages users: set the same build command / publish directory in the
# dashboard instead; it reads public/_headers natively but ignores this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12.0. Netlify still defaults to an older Node,
  # so without this pin the build fails with an engine error.
  NODE_VERSION = "24"

# SITE_URL must also be set (Site settings -> Environment variables) to the real
# domain, or canonical/OG/sitemap URLs fall back to https://example.com.

# Astro emits /about/index.html, so /about resolves natively. This only tidies
# up the legacy .html form if anyone links to it.
[[redirects]]
  from = "/:page.html"
  to = "/:page"
  status = 301
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
